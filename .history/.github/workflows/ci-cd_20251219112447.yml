name: CI-CD Pipeline FastAPI -> ECR -> ECS (with Alembic migrations)

# Trigger: run when code is pushed to main
on:
  push:
    branches: [ main ]

env:
  # Non-sensitive defaults — override via repo Secrets for production
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}     # e.g. my-fastapi-app
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}           # e.g. my-ecs-cluster
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}           # e.g. my-ecs-service
  ECS_TASK_FAMILY: ${{ secrets.ECS_TASK_FAMILY }}   # e.g. my-task-family
  CONTAINER_NAME: workforce360-container                                # must match name in ecs-task.json

  # We need id-token for OIDC assume-role and repo contents to build
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Authenticate to AWS with OIDC and assume role (recommended, no long-lived keys)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # GitHub secret containing role ARN
          aws-region: ${{ env.AWS_REGION }}
          # aws-region: ap-south-2

      # 3) Login to Amazon ECR 
      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v1

      # 4) Build & Push image using GitHub’s official Docker action
      - name: Build and push Docker image to ECR
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag the image with commit SHA (immutable) and also set latest if you want
          tags: |
            ${{ steps.ecr_login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr_login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      # 5) Render (fill) task definition JSON using AWS action
      #    This action replaces the image field in your base .github/ecs-task.json
      - name: Render ECS task definition (replace image)
        id: render_task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/ecs-task.json            # base task template in repo
          container-name: ${{ env.CONTAINER_NAME }}         # container to replace image for
          image: ${{ steps.ecr_login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 6) Save rendered task definition to file (for registration)
      - name: Write rendered task definition to file
        id: write_taskdef
        run: |
          RAW_OUTPUT="${{ steps.render_task.outputs.task-definition }}"

          echo "RAW OUTPUT:"
          echo "$RAW_OUTPUT"

          # Check if it's a file path
          if [[ "$RAW_OUTPUT" == /*.json ]]; then
            echo "It is a file path. Copying file..."
            cp "$RAW_OUTPUT" rendered-taskdef.json
          else
            echo "It is JSON content. Parsing with jq..."
            echo '${{ steps.render_task.outputs.task-definition }}' | jq '.' > rendered-taskdef.json
          fi

          echo "Rendered task definition saved:"
          cat rendered-taskdef.json



      # 7) Register the rendered task definition and capture the ARN
      - name: Register ECS task definition and capture ARN
        id: register_task
        run: |
          # Register the task definition with ECS
          REG_OUTPUT=$(aws ecs register-task-definition --cli-input-json file://rendered-taskdef.json)
          # Extract the taskDefinition ARN (e.g. arn:aws:ecs:...:task-definition/my-task-family:12)
          TASK_DEF_ARN=$(echo "$REG_OUTPUT" | jq -r '.taskDefinition.taskDefinitionArn')
          if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "null" ]; then
            echo "Failed to register task definition"
            echo "$REG_OUTPUT"
            exit 1
          fi
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV
          echo "Registered TaskDefinition ARN: $TASK_DEF_ARN"

      # 8) Run Alembic migrations as a one-off Fargate task (overrides command)
        #  This step will:
          #  - start a run-task with the just-registered task definition
          #  - wait until the task stops
          #  - check container exit code; fail if migrations failed
      - name: Run Alembic migrations (one-off Fargate task)
        env:
          SUBNETS: ${{ secrets.PRIVATE_SUBNETS }         # JSON list "subnet-aaa,subnet-bbb" or comma-separated
          SECURITY_GROUPS: ${{ secrets.SECURITY_GROUPS } # "sg-aaa,sg-bbb"
        run: |
          set -euo pipefail

          echo "Starting migrations with task definition $TASK_DEF_ARN"

          # Run the task overriding the container's command to run alembic
          RUN_OUT=$(aws ecs run-task \
            --cluster "${{ env.ECS_CLUSTER }" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEF_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUPS}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"'"${{ env.CONTAINER_NAME }"'","command":["/bin/sh","-c","alembic upgrade head"]}]}' \
            --count 1)

          # Extract the started task ARN
          TASK_ARN=$(echo "$RUN_OUT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK_ARN" ]; then
            echo "Failed to start migration task:"
            echo "$RUN_OUT"
            exit 1
          fi

          echo "Migration task ARN: $TASK_ARN"

          # Wait for the task to reach STOPPED
          echo "Waiting for migration task to stop..."
          aws ecs wait tasks-stopped --cluster "${{ env.ECS_CLUSTER }" --tasks "$TASK_ARN"

          # Fetch final task description to inspect container exit code / reason
          DESCRIBE=$(aws ecs describe-tasks --cluster "${{ env.ECS_CLUSTER }" --tasks "$TASK_ARN")
          EXIT_CODE=$(echo "$DESCRIBE" | jq -r '.tasks[0].containers[0].exitCode // empty')
          REASON=$(echo "$DESCRIBE" | jq -r '.tasks[0].stoppedReason // empty')

          echo "Migration task stopped. exitCode=$EXIT_CODE stoppedReason=$REASON"

          # If exitCode is present and non-zero, fail the job
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" -ne 0 ]; then
            echo "Migrations failed (exit code: $EXIT_CODE). See logs in CloudWatch."
            exit 1
          fi

          echo "Migrations completed successfully."

      # 9) Update ECS service to new task definition ARN (this triggers rolling update)
      - name: Update ECS service to use new task definition
        run: |
          echo "Updating ECS service to use $TASK_DEF_ARN"
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "Service: ${{ env.ECS_SERVICE }}"
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$TASK_DEF_ARN"

      # 10) Wait for ECS Service to stabilize (deployment finished)
      - name: Wait for ECS service to stabilize
        run: |
          echo "Waiting for service to become stable..."
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"
          echo "ECS service is stable. Deployment finished."
